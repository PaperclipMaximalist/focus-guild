# One real sign-in of the iPhone app, driven by Maestro in the simulator
# (.github/workflows/ios-signin.yml, through run.sh run-flow).
#
# The app opens <website>/app-link in the browser sheet (SFSafariViewController),
# the website asks the server for a one-time code and sends the sheet to
# focusguild://link, iOS hands that to the app, and the app trades the code for
# a device token kept in the Keychain (client/src/native/auth.ts).
#
# Texts are Maestro regexes matched against the whole label. All are
# case-insensitive ((?i)): headings and buttons are drawn in capitals by CSS
# (text-transform: uppercase), and WebKit may report the drawn text rather
# than the source. The sign-in button carries aria-label "Sign in to Focus
# Guild", which iOS may report instead of its visible "Sign in", so both match.
# Timeouts are generous: a cold simulator on a CI runner is slow.
appId: com.focusguild.app
name: iOS sign-in hand-off
---
- launchApp:
    label: Launch the app with no saved state and an empty Keychain
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    label: The sign-in screen is showing
    visible: "(?i)Sign in( to Focus Guild)?"
    timeout: 180000
- takeScreenshot: 01-sign-in

- tapOn:
    label: Press Sign in (opens the website in the browser sheet)
    text: "(?i)Sign in( to Focus Guild)?"
- extendedWaitUntil:
    label: The website's Connect page is showing in the sheet
    visible: "(?i)Connect the iPhone app"
    timeout: 120000
- extendedWaitUntil:
    label: The Connect this iPhone button is showing
    visible: "(?i)Connect this iPhone"
    timeout: 60000
- takeScreenshot: 02-browser-sheet

- tapOn:
    label: Press Connect this iPhone (the website asks the server for a one-time code)
    text: "(?i)Connect this iPhone"
# Shows whatever came next: the page's own "Opening Focus Guild" step, or the
# app already signed in.
- takeScreenshot: 03-after-connect
# There was a step here that pressed "Open" if iOS asked whether to open the
# link in Focus Guild. iOS never asked in any run (the sheet hands the link
# straight to the app), and on 2026-11-20 Maestro's driver died while that
# optional step was still looking, during the switch from the sheet back to
# the app, although the sign-in itself had worked. Removed.
# If the page could not hand the link over by itself, it shows a button that does.
- runFlow:
    label: If the page still offers Open Focus Guild, press it (and Open, if iOS asks)
    when:
      visible: "(?i)Open Focus Guild"
    commands:
      - tapOn: "(?i)Open Focus Guild"
      - tapOn:
          text: "(?i)Open"
          optional: true

# The rest (the signed-in app, then a restart) is its own flow, so that
# run.sh can start it again by itself if Maestro stops during the switch
# from the browser sheet back to the app (it has, twice, after the sign-in
# had worked: the server had traded the code and the app showed Today).
- runFlow: flow-signed-in.yaml
