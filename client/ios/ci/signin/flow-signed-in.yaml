# The second half of the sign-in check: the app is signed in, and still
# signed in after a restart (the token is read back from the Keychain).
# flow.yaml runs it after the hand-off; client/ios/ci/signin/run.sh runs it
# on its own when Maestro stopped during the hand-off although the server had
# already traded the app's code for a token.
appId: com.focusguild.app
name: iOS sign-in, from the signed-in app
---
# Only a signed-in member sees these: the welcome guide on Today (a brand-new
# member has no XP, so it shows) and the tab bar.
- extendedWaitUntil:
    label: The signed-in app is showing (Today's welcome guide)
    visible: "(?i)Welcome to the Guild"
    timeout: 120000
- assertVisible:
    label: The tab bar is showing
    text: "(?i)Route"
- takeScreenshot: 04-signed-in

# The session must survive a restart: the token is read back from the Keychain.
- stopApp
- launchApp:
    label: Relaunch the app without clearing anything
    clearState: false
- extendedWaitUntil:
    label: Still signed in after the relaunch
    visible: "(?i)Welcome to the Guild"
    timeout: 120000
- assertVisible:
    label: The tab bar is showing after the relaunch
    text: "(?i)Route"
- takeScreenshot: 05-relaunched

# Then Delete account from inside the app (its own file, so it can be read alone).
- runFlow: flow-delete.yaml
